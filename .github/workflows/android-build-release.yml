name: DrawMotion Android Build & Release

on:
  push:
    branches: [main, drawmotion-v0.3.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DrawMotion-v0.3.0-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - name: Create release on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release delete v0.3.0 --yes
          fi
          gh release create v0.3.0             --title "DrawMotion v0.3.0"             --notes "Native Android 2D drawing and animation editor with layers, timeline, rulers, textures, procedural resources, project files and MP4 export."             app/build/outputs/apk/debug/app-debug.apk             app/build/outputs/apk/release/app-release-unsigned.apk